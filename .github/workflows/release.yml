name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  wheels:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_17'

          - name: Linux aarch64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            manylinux: '2_17'

          - name: Windows x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: 'off'

          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: 'off'

          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            manylinux: 'off'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: >-
            --release
            --locked
            --out dist
            --compatibility pypi

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build source distribution
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build source distribution
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          maturin-version: v1.14.1
          args: --out dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  verify:
    name: Verify distributions
    runs-on: ubuntu-24.04

    needs:
      - wheels
      - sdist

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v5
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v5
        with:
          name: sdist
          path: dist

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)

          if [ "${#wheels[@]}" -ne 5 ]; then
            echo "Expected 5 wheels, found ${#wheels[@]}"
            printf '%s\n' "${wheels[@]}"
            exit 1
          fi

          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "Expected 1 source distribution, found ${#sdists[@]}"
            printf '%s\n' "${sdists[@]}"
            exit 1
          fi

          for wheel in "${wheels[@]}"; do
            echo "Checking $wheel"

            if [[ "$(basename "$wheel")" != *-cp311-abi3-* ]]; then
              echo "Expected cp311-abi3 wheel: $wheel"
              exit 1
            fi
          done

          printf '%s\n' "${wheels[@]}" "${sdists[@]}" | sort

      - name: Validate package metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-24.04

    needs:
      - verify

    environment:
      name: pypi
      url: https://pypi.org/project/polars-cnlp/

    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v5
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v5
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
