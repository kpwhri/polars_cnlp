name: Test

on:
  workflow_dispatch:

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build and test dependencies
        run: python -m pip install --upgrade pip maturin pytest polars

      - name: Build wheel
        run: maturin build --release --out dist

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl

      - name: Run tests
        run: pytest